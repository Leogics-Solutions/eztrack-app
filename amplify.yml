version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - test "$NEXT_PUBLIC_API_URL" = "https://maincellapi.smartdok.ai"
        - export NEXT_BUILD_DIR=.next
        - npm run test:ci
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
